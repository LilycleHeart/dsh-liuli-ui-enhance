<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声纹效果预览 · 琉璃主题</title>
<style>
  :root {
    --brand: #1d9bf0;
    --bg: #0d0f13;
    --panel: rgba(24, 27, 34, 0.92);
    --line: rgba(255,255,255,0.08);
    --text: #d5dae3;
    --dim: #8b93a3;
    --accent: #2fd4b0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    pointer-events: none; /* 背景 canvas 点击穿透 */ }
  #panel {
    position: fixed; right: 16px; top: 16px; width: 264px; max-height: calc(100% - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(14px); padding: 14px 16px; overflow-y: auto; z-index: 10;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  }
  h1 { font-size: 14px; margin: 0 0 4px; font-weight: 600; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 12px; }
  .group { border-top: 1px solid var(--line); padding: 9px 0 4px; }
  .group > .gt { font-size: 11px; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .6px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .row label { flex: 1; display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .row input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); height: 3px; }
  .row .val { width: 34px; text-align: right; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .btn {
    margin-top: 10px; width: 100%; padding: 7px 0; border-radius: 9px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.05); color: var(--text); cursor: pointer; font-size: 12.5px;
  }
  .btn:hover { background: rgba(255,255,255,0.10); }
  .btn.playing { background: rgba(47,212,176,0.16); border-color: rgba(47,212,176,0.5); }
  .hint { color: var(--dim); font-size: 10.5px; margin-top: 10px; line-height: 1.45; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 6px;
    background: rgba(47,212,176,0.15); color: var(--accent); margin-left: 6px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="panel">
  <h1>声纹效果预览<span class="tag">合成音频驱动</span></h1>
  <div class="sub">Web Audio 合成节奏+旋律+镲片，真实跑声纹分析管线，无需系统音频。默认开启新效果，可逐个关掉对比现有三事件。</div>

  <button id="play" class="btn">▶ 开始播放演示音乐</button>

  <div class="group">
    <div class="gt">现有事件（对比基准）</div>
    <div class="row"><label><input type="checkbox" id="evBass" checked>低频·冲击（膨胀/加粗）</label></div>
    <div class="row"><label><input type="checkbox" id="evMid" checked>中频·流速（加快流动）</label></div>
    <div class="row"><label><input type="checkbox" id="evHigh" checked>高频·变色（→青）</label></div>
  </div>

  <div class="group">
    <div class="gt">新效果 · 光</div>
    <div class="row"><label><input type="checkbox" id="fxRing" checked>节拍脉冲环</label></div>
    <div class="row">
      <label>余晖（拖影）</label>
      <input type="range" id="fxTrail" min="0" max="0.95" step="0.01" value="0.3">
      <span class="val" id="fxTrailV">0.30</span>
    </div>
  </div>

  <div class="group">
    <div class="gt">新效果 · 空间 / 量化</div>
    <div class="row"><label><input type="checkbox" id="fxPeak" checked>波峰能量亮点</label></div>
    <div class="row"><label><input type="checkbox" id="fxRipple" checked>中频横向涟漪</label></div>
    <div class="row"><label><input type="checkbox" id="fxTick" checked>节拍刻度线</label></div>
  </div>

  <div class="group">
    <div class="gt">演示参数</div>
    <div class="row">
      <label>节拍密度</label>
      <input type="range" id="tempo" min="70" max="160" step="1" value="112">
      <span class="val" id="tempoV">112</span>
    </div>
    <div class="row">
      <label>镲片量（高频）</label>
      <input type="range" id="hatLevel" min="0" max="1" step="0.01" value="0.55">
      <span class="val" id="hatLevelV">0.55</span>
    </div>
  </div>

  <div class="hint">提示：新效果全部只用现有数据（频段包络 / 鼓点 punch / 频谱 bin），不加 shadowBlur（那是每帧最大开销）。拖动「余晖」至 0 即关闭。</div>
</div>

<script>
'use strict'
/* ══════════ 画布与场景 ══════════ */
const cv = document.getElementById('cv')
const ctx = cv.getContext('2d')
let W = 0, H = 0
function resize() {
  W = cv.width = Math.floor(innerWidth * devicePixelRatio)
  H = cv.height = Math.floor(innerHeight * devicePixelRatio)
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
}
addEventListener('resize', resize)
resize()

// 模拟 header 波形区域：占据画布主区域，上下留出演示信息带
const WAVE_TOP = 64, WAVE_BOT = 100

/* ══════════ 合成演示音乐（Web Audio） ══════════ */
let actx = null, analyser = null, master = null, playing = false
const freqBuf = new Uint8Array(256)
const specSmooth = new Float32Array(256)

function ensureAudio() {
  if (actx) return
  actx = new (window.AudioContext || window.webkitAudioContext)()
  master = actx.createGain()
  master.gain.value = 0.85
  master.connect(actx.destination)
  analyser = actx.createAnalyser()
  analyser.fftSize = 256
  analyser.smoothingTimeConstant = 0.55
  master.connect(analyser)
}

function noiseBuffer() {
  const len = actx.sampleRate * 0.06
  const buf = actx.createBuffer(1, len, actx.sampleRate)
  const d = buf.getChannelData(0)
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1
  return buf
}
let noiseBuf = null

function kick(t) {
  const o = actx.createOscillator(), g = actx.createGain()
  o.type = 'sine'
  o.frequency.setValueAtTime(150, t)
  o.frequency.exponentialRampToValueAtTime(46, t + 0.12)
  g.gain.setValueAtTime(0.95, t)
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.28)
  o.connect(g); g.connect(master)
  o.start(t); o.stop(t + 0.3)
}
function snare(t) {
  const src = actx.createBufferSource(); src.buffer = noiseBuf
  const g = actx.createGain(), f = actx.createBiquadFilter()
  f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.8
  g.gain.setValueAtTime(0.5, t)
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16)
  src.connect(f); f.connect(g); g.connect(master)
  src.start(t); src.stop(t + 0.18)
}
function hat(t, open) {
  const src = actx.createBufferSource(); src.buffer = noiseBuf
  const g = actx.createGain(), f = actx.createBiquadFilter()
  f.type = 'highpass'; f.frequency.value = 7000
  const dur = open ? 0.22 : 0.05
  g.gain.setValueAtTime(open ? 0.22 : 0.30, t)
  g.gain.exponentialRampToValueAtTime(0.001, t + dur)
  src.connect(f); f.connect(g); g.connect(master)
  src.start(t); src.stop(t + dur + 0.02)
}
function bassNote(t, f, dur) {
  const o = actx.createOscillator(), g = actx.createGain(), flt = actx.createBiquadFilter()
  o.type = 'sawtooth'; o.frequency.value = f
  flt.type = 'lowpass'; flt.frequency.setValueAtTime(900, t)
  flt.frequency.exponentialRampToValueAtTime(240, t + dur)
  g.gain.setValueAtTime(0.001, t)
  g.gain.exponentialRampToValueAtTime(0.34, t + 0.02)
  g.gain.exponentialRampToValueAtTime(0.001, t + dur)
  o.connect(flt); flt.connect(g); g.connect(master)
  o.start(t); o.stop(t + dur + 0.05)
}
function padNote(t, f, dur) {
  const o1 = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain()
  o1.type = 'triangle'; o1.frequency.value = f
  o2.type = 'triangle'; o2.frequency.value = f * 1.005
  g.gain.setValueAtTime(0.001, t)
  g.gain.linearRampToValueAtTime(0.10, t + 0.4)
  g.gain.linearRampToValueAtTime(0.001, t + dur)
  o1.connect(g); o2.connect(g); g.connect(master)
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05)
}

let schedulerTimer = null, nextNote = 0
const bassLine = [55, 55, 65.4, 55, 82.4, 73.4, 65.4, 55]
const padChords = [
  [220, 261.6, 329.6], [196, 246.9, 293.7], [174.6, 220, 261.6], [164.8, 207.7, 246.9],
  [220, 261.6, 329.6], [196, 246.9, 293.7], [233.1, 293.7, 349.2], [196, 246.9, 293.7],
]

function scheduleLoop() {
  const spb = 60 / tempoVal()          // 秒每拍
  const t16 = spb / 4                  // 十六分
  const lookahead = 0.5
  while (nextNote < actx.currentTime + lookahead) {
    const bar = Math.floor(nextNote / (spb * 4))
    const step = Math.round((nextNote % (spb * 4)) / t16) % 16
    if (step % 4 === 0) kick(nextNote)                        // 每拍 kick
    if ((step + 4) % 8 === 0) snare(nextNote)                 // 反拍 snare
    hat(nextNote, step % 8 === 7)                             // 持续 hi-hat
    if (step % 4 === 0) bassNote(nextNote, bassLine[(step / 4) % 8], spb * 1.6)
    if (step === 0) padNote(nextNote, padChords[bar % 8][0], spb * 3.6)
    nextNote += t16
  }
  schedulerTimer = setTimeout(scheduleLoop, 120)
}

function play() {
  ensureAudio()
  if (actx.state === 'suspended') void actx.resume()
  noiseBuf = noiseBuf || noiseBuffer()
  nextNote = actx.currentTime + 0.1
  scheduleLoop()
  playing = true
  playBtn.textContent = '⏸ 暂停演示'
  playBtn.classList.add('playing')
}
function pause() {
  clearTimeout(schedulerTimer)
  playing = false
  playBtn.textContent = '▶ 继续播放演示音乐'
  playBtn.classList.remove('playing')
}
const playBtn = document.getElementById('play')
playBtn.addEventListener('click', () => { playing ? pause() : play() })

/* ══════════ 渲染参数读取 ══════════ */
const $ = id => document.getElementById(id)
const on = id => $(id).checked
const val = (id, v) => { $(id + 'V').textContent = (+v).toFixed(2) }
function tempoVal() { return +$('tempo').value }
$('tempo').addEventListener('input', e => val('tempo', e.target.value))
$('hatLevel').addEventListener('input', e => val('hatLevel', e.target.value))
$('fxTrail').addEventListener('input', e => val('fxTrail', e.target.value))

/* ══════════ 声纹引擎等效状态（精简移植） ══════════ */
const bandEnv = [0, 0, 0]        // bass/mid/high 攻击-释放包络
const BAND_ATK = 0.35, BAND_REL = 0.18
const BANDS = [
  [1, 5],      // bass  ~50–350Hz
  [8, 42],     // mid   ~600Hz–3kHz
  [58, 120],   // high  4.5kHz+
]
let punch = 0                   // 鼓点衰减包络（每次 beat 置 1）
let presence = 0                // 信号存在感
let idlePhase = 0
let lastBeatAt = -1e9
const rings = []                // 脉冲环 { r, alpha }

function bandSum(from, to) {
  let s = 0
  for (let i = from; i <= to && i < freqBuf.length; i++) s += freqBuf[i] ?? 0
  return s / (to - from + 1)
}

/* ══════════ 颜色工具（与 HeaderEffects 同款） ══════════ */
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v }
function lighten(c, t) {
  const f = (n) => Math.round(n + (255 - n) * t)
  return [f(c[0]), f(c[1]), f(c[2])]
}
function mixRgb(a, b, t) {
  t = clamp01(t)
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]
}
function rgbToHsl(c) {
  const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn
  let h = 0
  if (d !== 0) {
    if (mx === r) h = ((g - b) / d) % 6
    else if (mx === g) h = (b - r) / d + 2
    else h = (r - g) / d + 4
    h *= 60
    if (h < 0) h += 360
  }
  const l = (mx + mn) / 2
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1))
  return [h, s, l]
}
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360
  const f = (n) => {
    const k = (n + h / 30) % 12
    return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1))
  }
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)]
}
function highTint(c) {
  const [h, s, l] = rgbToHsl(c)
  const s2 = Math.max(s, 0.6)
  const l2 = Math.min(1, l + 0.06)
  return hslToRgb(h + 0.86 * 30, s2, l2)   // 0.86 × 30° ≈ 色相 −50° → 青
}
const BRAND = [0x1d, 0x9b, 0xf0]
function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${+a.toFixed(3)})` }

/* ══════════ 主循环 ══════════ */
const trailAlphaEl = $('fxTrail')
let lastT = performance.now()

function frame(now) {
  requestAnimationFrame(frame)
  const dt = Math.min(0.05, (now - lastT) / 1000)
  lastT = now

  // ── 音频数据 ──
  if (actx) analyser.getByteFrequencyData(freqBuf)
  const hasSignal = actx !== null && freqBuf.some(v => v > 12)
  if (hasSignal) presence += (1 - presence) * 0.025
  else presence -= 0.004
  if (presence < 0) presence = 0

  // 频谱平滑
  for (let i = 0; i < freqBuf.length; i++) {
    const raw = (freqBuf[i] ?? 0) / 255
    specSmooth[i] = raw > specSmooth[i]
      ? specSmooth[i] + (raw - specSmooth[i]) * BAND_ATK
      : specSmooth[i] + (raw - specSmooth[i]) * BAND_REL
  }

  // 频段包络 + 节拍检测（谱通量简化版）
  const bandE = [bandSum(0, 2), bandSum(8, 42), bandSum(58, 120)]
  let beatNow = false
  if (actx) {
    let avg = 0
    for (let i = 0; i < freqBuf.length; i++) avg += freqBuf[i] ?? 0
    avg /= freqBuf.length
    const E = bandSum(0, freqBuf.length - 1)
    const thresh = bandSum(0, 2) * 1.6
    const cd = 80 / tempoVal() * 240
    if (E > avg * 0.6 && thresh > 14 && now - lastBeatAt > cd) {
      beatNow = true
      lastBeatAt = now
      punch = 1
    }
  }
  for (let b = 0; b < 3; b++) {
    bandEnv[b] = bandE[b] > bandEnv[b]
      ? bandEnv[b] + (bandE[b] - bandEnv[b]) * BAND_ATK
      : bandEnv[b] + (bandE[b] - bandEnv[b]) * BAND_REL
  }
  punch = Math.max(0, punch - dt * 2.6)

  // 脉冲环：beat 产生
  if (beatNow && on('fxRing')) rings.push({ r: 4, alpha: 0.85 })
  for (let i = rings.length - 1; i >= 0; i--) {
    const ring = rings[i]
    ring.r += dt * (90 + 30 * punch)
    ring.alpha -= dt * 1.6
    if (ring.alpha <= 0) rings.splice(i, 1)
  }

  // ── 绘制：余晖清屏（拖影） ──
  const trail = trailAlphaEl.value * (on('fxTrail') && +trailAlphaEl.value > 0 ? 1 : 0)
  if (trail > 0) {
    ctx.fillStyle = `rgba(13,15,19,${trail})`
    ctx.fillRect(0, 0, innerWidth, innerHeight)
  } else {
    ctx.fillStyle = '#0d0f13'
    ctx.fillRect(0, 0, innerWidth, innerHeight)
  }

  // 顶部标题带
  ctx.fillStyle = 'rgba(255,255,255,0.28)'
  ctx.font = '600 13px -apple-system, "Microsoft YaHei", sans-serif'
  ctx.textAlign = 'center'
  ctx.fillText('琉璃主题 · 声纹视觉事件预览（合成音频驱动）', innerWidth / 2, 26)

  drawWave()
  drawTicks()
}

/* ── 波形主体（精简移植 drawWave + 新效果） ── */
function drawWave() {
  const w = innerWidth
  const h = innerHeight - WAVE_TOP - WAVE_BOT
  const lineC = lighten(BRAND, 0.35)
  const cy = WAVE_TOP + h / 2
  const lines = 22
  const mix = 1

  const drive = (b) => {
    const env = bandEnv[b]
    return env < 0.02 ? 0 : Math.min(1, env / 0.9)
  }
  const bassDrive = drive(0)
  const midDrive = drive(1)
  const highDrive = drive(2)

  // high → 变色
  const colorShift = Math.min(1, highDrive * 0.85)
  const waveC = mixRgb(lineC, highTint(lineC), on('evHigh') ? colorShift : 0)

  // mid → 流速
  const speedMul = on('evMid') ? (1 + midDrive * 1.2) : 1
  idlePhase += 0.012 * (1 + presence * 2) * speedMul

  // 涟漪相位（新效果：中频横向涟漪）
  const rippleAmp = on('fxRipple') ? midDrive * 7 : 0

  // 波峰值记录（亮点用）
  const peakY = []
  const peakX = []

  for (let li = 0; li < lines; li++) {
    const off = li / lines - 0.5
    const baseY = cy + off * (h * 0.38)
    const idleAmp = (14 + (li % 7)) * (1 - Math.abs(off) * 1.4) * (1 - presence * 0.8)
    const binIdx = Math.min(specSmooth.length - 1, Math.floor((li / lines) * specSmooth.length))
    const binVal = specSmooth[binIdx]
    const amp = (idleAmp + mix * binVal * h * 0.3 * (1 - Math.abs(off) * 0.6)
      * (1 + punch * 0.6 + (on('evBass') ? bassDrive * 0.4 : 0))) * 1.4
    const alpha = 0.36 + (1 - Math.abs(off)) * 0.84
    const freq = 0.007 + li * 0.00055

    ctx.beginPath()
    ctx.strokeStyle = rgba(waveC, Math.min(1, alpha))
    ctx.lineWidth = 1 + mix * binVal * 0.8 + (on('evBass') ? bassDrive * 0.6 : 0)
    let maxNy = -Infinity, maxNx = 0
    for (let x = 0; x <= w; x += 3) {
      const ripple = rippleAmp * Math.sin(x * 0.02 + idlePhase * 2.3 + li * 0.5)
      const n = Math.sin(freq * x + idlePhase + li * 0.75)
        + 0.33 * Math.sin(freq * 2.4 * x + idlePhase * 1.35 + li * 1.15)
      const y = Math.max(1, Math.min(h - 1, baseY + (amp + ripple) * n))
      if (x === 0) ctx.moveTo(x, y)
      else ctx.lineTo(x, y)
      if (n > maxNy) { maxNy = n; maxNx = x }
    }
    ctx.stroke()
    peakY.push(Math.max(1, Math.min(h - 1, baseY + (amp + rippleAmp * Math.sin(maxNx * 0.02 + idlePhase * 2.3 + li * 0.5)) * maxNy)))
    peakX.push(maxNx)
  }

  // 波峰亮点（新效果）
  if (on('fxPeak')) {
    for (let li = 0; li < lines; li++) {
      const binIdx = Math.min(specSmooth.length - 1, Math.floor((li / lines) * specSmooth.length))
      const binVal = specSmooth[binIdx]
      if (binVal < 0.5) continue
      const glow = Math.min(1, (binVal - 0.5) * 2.2)
      ctx.fillStyle = rgba(mixRgb([255,255,255], waveC, 0.35), 0.35 + glow * 0.55)
      ctx.beginPath()
      ctx.arc(peakX[li], peakY[li], 1.2 + glow * 1.6, 0, Math.PI * 2)
      ctx.fill()
    }
  }

  // 中央主波
  ctx.shadowColor = rgba(waveC, 0.9)
  ctx.shadowBlur = 18
  ctx.beginPath()
  ctx.strokeStyle = rgba(mixRgb(waveC, [255,255,255], 0.12), 1)
  ctx.lineWidth = 2.2
  const mainVal = specSmooth[Math.floor(specSmooth.length * 0.25)]
  const mainAmp = (46 * (1 - presence * 0.8) + mix * mainVal * h * 0.2) * (1 + punch * 1.5)
  for (let x = 0; x <= w; x += 2) {
    const n = Math.sin(0.0105 * x + idlePhase * 0.58)
      + 0.3 * Math.sin(0.026 * x + idlePhase * 1.08)
      + 0.15 * Math.sin(0.052 * x + idlePhase * 1.85)
    const y = Math.max(1, Math.min(h - 1, cy + mainAmp * n))
    if (x === 0) ctx.moveTo(x, y)
    else ctx.lineTo(x, y)
  }
  ctx.stroke()
  ctx.shadowBlur = 0

  // 脉冲环（新效果）——画在主波上方，向外扩散
  if (on('fxRing')) {
    for (const ring of rings) {
      ctx.strokeStyle = rgba(waveC, Math.max(0, ring.alpha))
      ctx.lineWidth = 1.5
      ctx.beginPath()
      ctx.arc(innerWidth / 2, cy, ring.r, 0, Math.PI * 2)
      ctx.stroke()
    }
  }
}

/* ── 节拍刻度线（新效果）：底部瞬时击打点 ── */
function drawTicks() {
  if (!on('fxTick') || punch <= 0.02) return
  const w = innerWidth
  const y = innerHeight - WAVE_BOT + 22
  const len = w * 0.5 * punch
  ctx.fillStyle = rgba([0x2f, 0xd4, 0xb0], 0.5 + punch * 0.5)
  ctx.fillRect(w / 2 - len / 2, y, len, 2.5)
}

requestAnimationFrame(frame)
</script>
