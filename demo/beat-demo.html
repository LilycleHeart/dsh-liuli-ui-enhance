<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Liuli 声纹 · 鼓点检测 Demo</title>
<style>
  body { font: 13px/1.6 ui-monospace, monospace; background: #101014; color: #c8c8d0; margin: 0; padding: 16px; }
  h3 { margin: 0 0 4px; color: #8ecdf8; }
  #sub { color: #888; margin-bottom: 10px; font-size: 12px; }
  #bars { display: flex; gap: 3px; align-items: flex-end; height: 90px; margin-bottom: 12px; }
  #bars div { flex: 1; min-width: 8px; }
  .b-beat { background: #3af; }
  .b-level { background: #666; }
  .b-onset { background: #fa3; }
  .b-mix { background: #3f6; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #333; padding: 2px 10px; text-align: left; }
  th { color: #8ecdf8; }
  #tl { margin-top: 12px; white-space: pre; font-size: 12px; }
  .ok { color: #5f5; } .bad { color: #f55; }
  #log { margin-top: 8px; color: #f55; white-space: pre-wrap; }
</style>
</head>
<body>
<h3>鼓点检测 Demo（参数与 src/client/HeaderEffects.tsx 完全一致）</h3>
<div id="sub"></div>
<div id="bars"></div>
<table id="t"></table>
<div id="tl"></div>
<div id="log"></div>
<script>
// ═══════════════════════════════════════════════════════════════
// 检测参数 v3.1 —— Nanoleaf 风格连续响应（参照 aurora-sdk FrequencyStars）：
//   连续三频段能量（bass 0-3 / mid 4-15 / high 16-63 bin，128-bin FFT）
//   每频段：攻击/释放包络 → 绝对参考响度归一（保留响度动态）→ 加权
//   drive = Σ 权重 × clamp(env/REF, 0, 1)；mix = drive 平滑
// ═══════════════════════════════════════════════════════════════
const BANDS = [
  { name: 'bass', from: 0, to: 3, weight: 0.4 },
  { name: 'mid', from: 4, to: 15, weight: 0.35 },
  { name: 'high', from: 16, to: 63, weight: 0.25 },
]
const ENV_ATTACK = 0.3
const ENV_RELEASE = 0.05
const ENV_REF = 0.15 // 参考响度（满刻度 0..1 的 15%）：高于此的频段视为"强响应"
const MIN_ENV = 0.025 // 低于此电平视为静音，驱动归零（底噪门控）
const DRIVE_SMOOTH = 0.3
// 打击感包络（鼓点强调）：s16 谱通量瞬态 → punch 快攻快落，
// 击中时音频驱动振幅 ×(1 + PUNCH_GAIN×punch)，连续响应之上叠加鼓点幅度
const PUNCH_FLOOR = 0.02
const PUNCH_RATIO = 2
const PUNCH_FOLLOW = 0.15
const PUNCH_DECAY = 0.96 // 官方节奏脉冲形态：≈0.4s 半衰（0.9 时仅 0.1s，太短促）
const PUNCH_GAIN = 1.2 // 官方节拍 100% 强度：振幅 ×(1+1.2)
// ── 官方 Nanoleaf Desktop 节拍检测（能量包络对比 + 冷却）──
// 官方：E=Σx² vs 15 块滑动平均（块≈46ms → 0.7s 窗口）；60fps 帧 ≈ 42 帧
const BEAT_AVG_WIN = 42
const BEAT_MULT = 1.5 // 超过均值倍数
const BEAT_ADD = 10 // 至少超过均值量（官方 10，其能量为大尺度；归一化域用 0.02）
const BEAT_ADD_NORM = 0.02
const BEAT_COOLDOWN = 200 // 冷却 ms（防连击，最高 5 拍/秒）
const BEAT_MEAN_GATE = 0.002 // 平均能量门槛（官方 beatPowerThreshold 的"非静音"门）
// 低频脉冲检测（官方 EG：50-350Hz 能量 vs 0.8×60块均值(≈2.8s→170帧) + 220ms 冷却）
const PULSE_AVG_WIN = 170
const PULSE_MULT = 0.8
const PULSE_COOLDOWN = 220
const PULSE_FLOOR = 1

const params = new URLSearchParams(location.search)
const file = params.get('file') || ''
const dir = params.get('dir') || 'music' // music=CloudMusic, dl=Downloads
const secs = Number(params.get('secs') || 45)
const startSec = Number(params.get('start') || 0)
const ac = new AudioContext()
const analyser = ac.createAnalyser()
analyser.fftSize = 256
const freqBuf = new Uint8Array(analyser.frequencyBinCount)

const t0 = performance.now()
// v3 状态：每频段 env/peak；全局 mix 平滑
const bandState = BANDS.map(() => ({ env: 0, peak: 0 }))
let audioMix = 0
const driveSeries = []
const mixSeries = []
const bandSeries = [] // 每帧三频段包络（评估频段动态/鼓点脉动）
// 打击感包络状态
let prevS16 = 0
let punchBase = 0
let punch = 0
const punchSeries = []
// 官方 Nanoleaf 节拍/脉冲检测状态
const beatAvgQueue = []
const pulseAvgQueue = []
let lastBeatAt = -1e9
let lastPulseAt = -1e9
let offBeatCount = 0
let offPulseCount = 0
const offBeatTimes = []
const offPulseTimes = []
const per5 = new Map() // 每 5 秒: {sumMix, n}（时间线）
const frames = [] // 每帧：s4/s16/s64/st 频段和

function bandRaw(from, to) {
  let sum = 0
  const n = Math.min(to, freqBuf.length - 1) - from + 1
  for (let i = from; i <= to && i < freqBuf.length; i++) sum += freqBuf[i] ?? 0
  return sum / (n * 255) // 0..1
}

function frame() {
  const t = (performance.now() - t0) / 1000
  analyser.getByteFrequencyData(freqBuf)
  let s4 = 0, s16 = 0, s64 = 0, st = 0
  for (let i = 0; i < freqBuf.length; i++) {
    const v = freqBuf[i] ?? 0
    st += v
    if (i < 4) s4 += v
    if (i < 16) s16 += v
    if (i < 64) s64 += v
  }
  frames.push({ t, s4, s16, s64, st })

  // v3.1 连续驱动（Nanoleaf 风格）：三频段能量 → 攻击/释放包络 →
  // 参考响度归一（保留响度动态）→ 加权求和；底噪由 MIN_ENV 门控
  let drive = 0
  for (let b = 0; b < BANDS.length; b++) {
    const band = BANDS[b]
    const raw = bandRaw(band.from, band.to)
    const s = bandState[b]
    s.env += (raw - s.env) * (raw > s.env ? ENV_ATTACK : ENV_RELEASE)
    let v = s.env < MIN_ENV ? 0 : Math.min(1, s.env / ENV_REF)
    drive += band.weight * v
  }
  drive = Math.min(1, drive)
  audioMix += (drive - audioMix) * DRIVE_SMOOTH
  driveSeries.push(drive)
  mixSeries.push(audioMix)
  bandSeries.push(bandState.map(s => s.env))

  // ── 官方 Nanoleaf Desktop 检测（能量包络对比 + 冷却 + 两级强度）──
  // 帧能量 E = Σ(bin/255)²（对应官方 ei=Σx²）
  let E = 0
  for (let i = 0; i < freqBuf.length; i++) {
    const v = (freqBuf[i] ?? 0) / 255
    E += v * v
  }
  beatAvgQueue.push(E)
  if (beatAvgQueue.length > BEAT_AVG_WIN) beatAvgQueue.shift()
  const beatAvg = beatAvgQueue.reduce((s, v) => s + v, 0) / beatAvgQueue.length
  // 低频脉冲能量（50-350Hz ≈ bins 0-1 平均，官方 EG 频段）
  const pulseE = ((freqBuf[0] ?? 0) + (freqBuf[1] ?? 0)) / 2
  pulseAvgQueue.push(pulseE)
  if (pulseAvgQueue.length > PULSE_AVG_WIN) pulseAvgQueue.shift()
  const pulseAvg = pulseAvgQueue.reduce((s, v) => s + v, 0) / pulseAvgQueue.length
  const now = t * 1000
  // 官方 LY：节拍 = 能量超均值 50%（或 +0.02）&& 非静音门槛 && 200ms 冷却
  const isOfficialBeat = E > BEAT_MEAN_GATE * 128
    && E > Math.min(BEAT_MULT * beatAvg, beatAvg + BEAT_ADD_NORM)
    && now - lastBeatAt > BEAT_COOLDOWN
  if (isOfficialBeat) {
    offBeatCount++
    offBeatTimes.push(t)
    lastBeatAt = now
  }
  // 官方 EG：低频脉冲 = 50-350Hz 能量超 0.8×均值 && 下限 && 220ms 冷却
  const isOfficialPulse = pulseE > PULSE_FLOOR
    && pulseE > PULSE_MULT * pulseAvg
    && now - lastPulseAt > PULSE_COOLDOWN
  if (isOfficialPulse) {
    offPulseCount++
    offPulseTimes.push(t)
    lastPulseAt = now
  }
  // 两级强度（官方 RhythmicNorthernLights）：节拍 100%、脉冲 30%
  if (isOfficialBeat) punch = 1
  else if (isOfficialPulse) punch = Math.max(punch, 0.3)
  else punch *= PUNCH_DECAY
  punchSeries.push(punch)

  const b5 = Math.floor(t / 5) * 5
  const slot = per5.get(b5) ?? { sum: 0, n: 0 }
  slot.sum += audioMix; slot.n++
  per5.set(b5, slot)
  paint(t, drive, audioMix)
  if (t < secs) requestAnimationFrame(frame)
  else finish()
}

// ── 离线参数扫描 v3.1：从已采集的频段和重放连续驱动，统计 mix 分布 ──
function sweep() {
  const combos = []
  const run = (weights, attack, release, ref, minEnv, smooth) => {
    const st = [0, 1, 2].map(() => ({ env: 0 }))
    const drive = []
    for (const f of frames) {
      const raws = [
        f.s4 / (4 * 255),
        Math.max(0, f.s16 - f.s4) / (12 * 255),
        Math.max(0, f.s64 - f.s16) / (48 * 255),
      ]
      let d = 0
      for (let b = 0; b < 3; b++) {
        st[b].env += (raws[b] - st[b].env) * (raws[b] > st[b].env ? attack : release)
        d += weights[b] * (st[b].env < minEnv ? 0 : Math.min(1, st[b].env / ref))
      }
      drive.push(Math.min(1, d))
    }
    let mix = 0, sum = 0, sumSq = 0, hi = 0
    for (const d of drive) {
      mix += (d - mix) * smooth
      sum += mix; sumSq += mix * mix
      if (mix > 0.3) hi++
    }
    const n = drive.length
    const avg = sum / n
    const std = Math.sqrt(Math.max(0, sumSq / n - avg * avg))
    return { avg: +avg.toFixed(3), std: +std.toFixed(3), duty: +(hi / Math.max(1, n)).toFixed(3), max: +Math.max(...drive).toFixed(2) }
  }
  for (const w of ['bassheavy', 'balanced', 'midheavy']) {
    const weights = w === 'bassheavy' ? [0.5, 0.3, 0.2] : w === 'balanced' ? [0.4, 0.35, 0.25] : [0.3, 0.45, 0.25]
    for (const attack of [0.2, 0.35])
      for (const release of [0.03, 0.06])
        for (const ref of [0.1, 0.15, 0.25])
          combos.push({ w, attack, release, ref, ...run(weights, attack, release, ref, 0.025, 0.3) })
  }
  return combos
}

// 节拍周期估计：s16 谱通量序列自相关，取最强滞后（0.2s–2.5s 范围）
function pulseAnalysis() {
  const flux = []
  let last = 0
  for (const f of frames) {
    const v = Math.max(0, f.s16 - last) / (f.s16 + 1)
    flux.push(v)
    last = f.s16
  }
  const n = flux.length
  let best = null
  for (let lag = 12; lag <= Math.min(150, Math.floor(n / 2)); lag++) {
    let num = 0, d1 = 0, d2 = 0
    for (let i = 0; i < n - lag; i++) {
      num += flux[i] * flux[i + lag]
      d1 += flux[i] * flux[i]
      d2 += flux[i + lag] * flux[i + lag]
    }
    const r = d1 && d2 ? num / Math.sqrt(d1 * d2) : 0
    if (!best || r > best.r) best = { lag, r }
  }
  return best ? { period: +(best.lag / 60).toFixed(3), bpm: +(60 / (best.lag / 60)).toFixed(0), r: +best.r.toFixed(2) } : null
}

function finish() {
  // mix 分布统计（v3 连续驱动）
  const n = mixSeries.length
  const sum = mixSeries.reduce((s, v) => s + v, 0)
  const sumSq = mixSeries.reduce((s, v) => s + v * v, 0)
  const avg = sum / Math.max(1, n)
  const std = Math.sqrt(Math.max(0, sumSq / Math.max(1, n) - avg * avg))
  const duty = mixSeries.filter(v => v > 0.3).length / Math.max(1, n)
  // 频段动态：各频段包络的均值/标准差（bass 脉动 = 鼓点可见性）
  const bandStats = BANDS.map((b, bi) => {
    const sum = bandSeries.reduce((s, f) => s + f[bi], 0)
    const sq = bandSeries.reduce((s, f) => s + f[bi] * f[bi], 0)
    const m = sum / Math.max(1, bandSeries.length)
    return { name: b.name, avg: +m.toFixed(3), std: +Math.sqrt(Math.max(0, sq / Math.max(1, bandSeries.length) - m * m)).toFixed(3) }
  })
  // 打击感统计：punch>0.5 占比、振幅倍率 (1+GAIN×punch) 的均值/峰值
  const punchDuty = punchSeries.filter(v => v > 0.5).length / Math.max(1, punchSeries.length)
  const mul = punchSeries.map(v => 1 + PUNCH_GAIN * v)
  const mulAvg = mul.reduce((s, v) => s + v, 0) / Math.max(1, mul.length)
  const mulMax = Math.max(...mul)
  const tl = []
  for (let s = 0; s < secs; s += 5) {
    const slot = per5.get(s)
    const avgM = slot ? slot.sum / slot.n : 0
    tl.push(`${String(s).padStart(2)}-${String(s + 5).padStart(2)}s: ${'█'.repeat(Math.min(20, Math.round(avgM * 20)))}  M=${avgM.toFixed(2)}`)
  }
  window.__result = {
    file, path: pathUsed, secs, frames: frames.length,
    avgMix: +avg.toFixed(3), mixStd: +std.toFixed(3), duty: +duty.toFixed(3),
    bands: bandStats,
    punch: { duty: +punchDuty.toFixed(3), avgMul: +mulAvg.toFixed(3), maxMul: +mulMax.toFixed(2) },
    official: { beat: offBeatCount, pulse: offPulseCount,
      beatPerSec: +(offBeatCount / Math.max(1, secs)).toFixed(2),
      pulsePerSec: +(offPulseCount / Math.max(1, secs)).toFixed(2) },
    timeline: tl.join('\n'),
    pulse: pulseAnalysis(),
    sweep: sweep(),
  }
  const t = document.getElementById('t')
  t.innerHTML = `<tr><th>file</th><td>${window.__result.file}</td></tr>
    <tr><th>secs</th><td>${window.__result.secs}</td></tr>
    <tr><th>avgMix / std / duty(>0.3)</th><td>${window.__result.avgMix} / ${window.__result.mixStd} / ${window.__result.duty}</td></tr>
    <tr><th colspan="2">参数扫描（weights/attack/release/logBase → avg · std · duty · max）</th></tr>`
  for (const c of window.__result.sweep) {
    t.innerHTML += `<tr><td>${c.w}/${c.attack}/${c.release}/${c.logBase}</td><td>${c.avg} · ${c.std} · ${c.duty} · ${c.max}</td></tr>`
  }
  document.getElementById('tl').textContent = window.__result.timeline
  document.title = 'DONE ' + file
}

function paint(t, drive, mix) {
  const bars = document.getElementById('bars')
  bars.innerHTML = ''
  for (const [v, cls] of [[drive, 'b-beat'], [mix, 'b-mix']]) {
    const d = document.createElement('div')
    d.className = cls
    d.style.height = Math.round(Math.min(1, v) * 90) + 'px'
    bars.appendChild(d)
  }
  document.getElementById('sub').textContent =
    `${file}  ${t.toFixed(1)}s / ${secs}s  drive=${drive.toFixed(3)} mix=${mix.toFixed(3)}`
}

let pathUsed = 'none' // 'decode' | 'element'

async function boot() {
  document.getElementById('sub').textContent = `加载 /${dir}/${file} ...`
  try {
    // b64=1：音频字节由 CDP 驱动注入（绕开 IDM 等下载拦截器），等待注入完成
    if (params.get('b64') === '1' && !window.__audioReady) {
      await new Promise((res) => {
        const iv = setInterval(() => { if (window.__audioReady) { clearInterval(iv); res() } }, 200)
        setTimeout(() => { clearInterval(iv); res() }, 90000)
      })
    }
    // 优先 decodeAudioData（缓冲源，无头 Chrome 下最可靠）；失败则回退
    // denpa_echo 式 <audio> 元素 + MediaElementSource（元素解码器更健壮）
    let audioBuf = null
    try {
      let buf = null
      if (window.__audioB64) {
        const bin = atob(window.__audioB64)
        const bytes = new Uint8Array(bin.length)
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
        buf = bytes.buffer // decodeAudioData 需要 ArrayBuffer（视图会抛 TypeError）
      } else {
        const resp = await fetch('/' + dir + '/' + encodeURIComponent(file))
        if (resp.ok) buf = await resp.arrayBuffer()
      }
      if (buf) audioBuf = await ac.decodeAudioData(buf)
    } catch (_) { audioBuf = null }

    if (audioBuf !== null) {
      pathUsed = 'decode'
      const s = ac.createBufferSource()
      s.buffer = audioBuf
      s.connect(analyser)
      s.start(0, startSec)
      if (ac.state === 'suspended') await ac.resume().catch(() => {})
      document.getElementById('sub').textContent = `播放中(decode): ${file} @${startSec}s`
      requestAnimationFrame(frame)
      return
    }

    // 回退：<audio> 元素 → MediaElementSource → analyser
    pathUsed = 'element'
    const audioEl = new Audio('/' + dir + '/' + encodeURIComponent(file))
    audioEl.preload = 'auto'
    await new Promise((res, rej) => {
      audioEl.addEventListener('canplay', res, { once: true })
      audioEl.addEventListener('error', () => rej(new Error('音频加载失败: ' + (audioEl.error?.message ?? ''))), { once: true })
    })
    const srcNode = ac.createMediaElementSource(audioEl)
    srcNode.connect(analyser)
    analyser.connect(ac.destination)
    if (ac.state === 'suspended') await ac.resume().catch(() => {})
    audioEl.currentTime = startSec
    // 等待 seek 完成再播放，确保从指定偏移开始分析
    await new Promise((res) => {
      if (Math.abs(audioEl.currentTime - startSec) < 0.15) res()
      else audioEl.addEventListener('seeked', res, { once: true })
    })
    const started = audioEl.play()
    if (started) {
      started.catch(() => {
        // 自动播放被浏览器拦截（手动打开 demo 时）：点击页面再开始
        document.getElementById('sub').textContent = '自动播放被拦截：点击页面任意处开始测试'
        document.body.addEventListener('click', () => { void audioEl.play(); requestAnimationFrame(frame) }, { once: true })
        return
      })
    }
    document.getElementById('sub').textContent = `播放中(element): ${file} @${startSec}s`
    requestAnimationFrame(frame)
  } catch (e) {
    document.getElementById('log').textContent = '加载失败: ' + e
    window.__result = { file, error: String(e) }
    document.title = 'DONE ' + file
  }
}
boot()
</script>
</body>
</html>
